services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport123
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transport_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transport_db
      DB_USERNAME: transport
      DB_PASSWORD: transport123
      JWT_SECRET: VGhpcy1pcy1hLWRlbW8tc2VjcmV0LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0xMjM0NTY=
      ADMIN_EMAIL: admin@transport.local
      ADMIN_PASSWORD: Admin@123
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
