spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transport_db}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRlbW8tc2VjcmV0LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${ADMIN_EMAIL:admin@transport.local}
    password: ${ADMIN_PASSWORD:Admin@123}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
